name: CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "data/**/*.csv"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "data/**/*.csv"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m py_compile app.py views.py view_utils.py view_general.py view_latam.py view_math_activity.py view_evolution.py view_improve.py view_internal.py view_story.py loaders.py processing.py config.py data_quality.py schemas.py ui.py
          python -m py_compile scripts/audit_public_data.py

      - name: Static undefined-name check
        run: |
          ruff check app.py views.py view_utils.py view_general.py view_latam.py view_math_activity.py view_evolution.py view_improve.py view_internal.py view_story.py loaders.py processing.py config.py data_quality.py schemas.py ui.py --select F821

      - name: Audit public data
        run: python scripts/audit_public_data.py

      - name: Run tests
        run: pytest -q
