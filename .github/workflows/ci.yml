name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m py_compile app.py views.py loaders.py processing.py config.py data_quality.py schemas.py ui.py
          python -m py_compile scripts/audit_public_data.py

      - name: Static undefined-name check
        run: ruff check app.py views.py loaders.py processing.py config.py data_quality.py schemas.py ui.py --select F821

      - name: Audit public data
        run: python scripts/audit_public_data.py

      - name: Run tests
        run: pytest -q
